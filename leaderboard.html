<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜 | GreenStep</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g900:#0a2e1a;--g800:#0d3d23;--g700:#0f4d2c;--g600:#146b38;--g500:#1a8a46;--g400:#22c55e;--g300:#4ade80;--teal:#0ff4c6;--yellow:#ffd60a;--orange:#ff6b35;--bg:#071a0e;--sidebar-w:240px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:white;min-height:100vh;display:flex;}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:linear-gradient(180deg,#0d3d23 0%,#071a0e 100%);border-right:1px solid rgba(34,197,94,0.12);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:40;transition:transform 0.3s;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(34,197,94,0.1);}
.nav-section{padding:16px 12px 4px;}
.nav-section-title{font-size:10px;font-weight:600;color:rgba(74,222,128,0.4);letter-spacing:1px;text-transform:uppercase;padding:0 8px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,0.55);transition:all 0.2s;margin-bottom:2px;text-decoration:none;}
.nav-item:hover{background:rgba(34,197,94,0.1);color:rgba(255,255,255,0.9);}
.nav-item.active{background:rgba(34,197,94,0.18);color:#4ade80;}
.nav-badge{margin-left:auto;background:var(--g500);color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.sidebar-user{margin-top:auto;padding:16px;border-top:1px solid rgba(34,197,94,0.1);}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--g500),var(--teal));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:rgba(7,26,14,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(34,197,94,0.1);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
.content{padding:24px 28px;flex:1;}
.card{background:linear-gradient(135deg,rgba(13,61,35,0.7) 0%,rgba(10,46,26,0.5) 100%);border:1px solid rgba(34,197,94,0.15);border-radius:16px;padding:20px;backdrop-filter:blur(8px);}
.icon-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(34,197,94,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
.icon-btn:hover{background:rgba(34,197,94,0.15);}
.tab-btn{padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;background:transparent;color:rgba(255,255,255,0.4);}
.tab-btn.active{background:rgba(34,197,94,0.2);color:var(--g300);}
.tab-btn:hover:not(.active){color:rgba(255,255,255,0.7);}
.period-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(34,197,94,0.2);font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;background:transparent;color:rgba(255,255,255,0.45);}
.period-btn.on{background:rgba(34,197,94,0.15);color:var(--g300);border-color:rgba(34,197,94,0.4);}

/* Podium */
.podium-container{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:20px 0 0;}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;position:relative;}
.podium-crown{position:absolute;top:-16px;font-size:18px;}
.podium-base{border-radius:12px 12px 0 0;width:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px 8px;}
.podium-1{background:linear-gradient(180deg,rgba(255,214,10,0.3),rgba(255,214,10,0.1));border:1px solid rgba(255,214,10,0.4);}
.podium-2{background:linear-gradient(180deg,rgba(200,200,200,0.2),rgba(200,200,200,0.05));border:1px solid rgba(200,200,200,0.3);}
.podium-3{background:linear-gradient(180deg,rgba(200,120,40,0.2),rgba(200,120,40,0.05));border:1px solid rgba(200,120,40,0.3);}

/* LB Table */
.lb-table{width:100%;}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;transition:all 0.2s;margin-bottom:4px;}
.lb-row:hover{background:rgba(34,197,94,0.06);}
.lb-row.me{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);}
.lb-rank{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;width:28px;text-align:center;flex-shrink:0;}
.rank-g{color:var(--yellow);}
.rank-s{color:rgba(200,200,200,0.9);}
.rank-b{color:rgba(200,120,40,0.9);}
.rank-n{color:rgba(255,255,255,0.3);}
.lb-name{font-size:14px;font-weight:500;flex:1;}
.lb-dept{font-size:11px;color:rgba(255,255,255,0.4);}
.lb-pts{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--g300);flex-shrink:0;}
.lb-change{font-size:11px;flex-shrink:0;width:36px;text-align:right;}
.lb-bar-wrap{width:100px;flex-shrink:0;}
.lb-bar-track{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.lb-bar-fill{height:100%;background:linear-gradient(90deg,var(--g500),var(--teal));border-radius:2px;}

.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:35;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{margin-left:0;}
  .topbar{padding:0 16px;}
  .content{padding:16px;}
  .mobile-menu-btn{display:flex;}
  .podium-base{width:70px;}
  .lb-bar-wrap{display:none;}
}
.fade-in{animation:fadeIn 0.5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--g700);border-radius:2px;}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div style="display:flex;align-items:center;gap:10px;"><svg width="28" height="28" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="17" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/><path d="M18 6 C10 6 6 12 8 18 C10 24 16 28 18 30 C20 28 26 24 28 18 C30 12 26 6 18 6Z" fill="#22c55e" opacity="0.3"/><path d="M18 6 C22 10 26 15 24 20 C22 25 20 28 18 30" fill="#0ff4c6" opacity="0.6"/><circle cx="18" cy="18" r="3" fill="#0ff4c6"/></svg><div><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:white;">GreenStep</div><div style="font-size:10px;color:rgba(74,222,128,0.6);">ESG Gamification</div></div></div></div>
  <div class="nav-section">
    <div class="nav-section-title">主選單</div>
    <a href="dashboard.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="events.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 2v3m8-3v3M3 8h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>活動<span class="nav-badge">3</span></a>
    <a href="missions.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>任務<span class="nav-badge">5</span></a>
    <a href="leaderboard.html" class="nav-item active"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>排行榜</a>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">ESG</div>
    <a href="esg.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945"/></svg>ESG 統計</a>
    <a href="rewards.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 8v13m0-13V6a4 4 0 014-4H6a4 4 0 014 4v2m-4 0h8M5 8h14l1 12H4L5 8z"/></svg>獎勵商城</a>
  </div>
  <div class="sidebar-user"><div style="display:flex;align-items:center;gap:10px;"><div class="avatar" id="sidebarAvatar">?</div><div><div style="font-size:13px;font-weight:600;" id="sidebarName">使用者</div><div style="font-size:11px;color:rgba(74,222,128,0.6);">一般使用者</div></div></div></div>
</aside>

<div class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="icon-btn mobile-menu-btn" onclick="toggleSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div><div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;">排行榜</div><div style="font-size:11px;color:rgba(74,222,128,0.5);">查看全體競賽排名</div></div>
    </div>
    <div class="avatar" id="topbarAvatar" style="width:32px;height:32px;font-size:12px;cursor:pointer;">?</div>
  </header>

  <div class="content">

    <!-- Tabs -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:14px;padding:4px;" id="mainTabs">
        <button class="tab-btn active" onclick="switchTab('personal',this)">個人排行</button>
        <button class="tab-btn" onclick="switchTab('dept',this)">部門排行</button>
        <button class="tab-btn" onclick="switchTab('company',this)">企業排行</button>
        <button class="tab-btn" onclick="switchTab('event',this)">活動排行</button>
      </div>
      <div style="display:flex;gap:6px;" id="periodBtns">
        <button class="period-btn on" onclick="switchPeriod('week',this)">本週</button>
        <button class="period-btn" onclick="switchPeriod('month',this)">本月</button>
        <button class="period-btn" onclick="switchPeriod('year',this)">今年</button>
      </div>
    </div>

    <!-- My Rank Banner -->
    <div id="myRankBanner" class="fade-in" style="background:linear-gradient(135deg,rgba(34,197,94,0.15),rgba(15,244,198,0.08));border:1px solid rgba(34,197,94,0.3);border-radius:16px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="width:44px;height:44px;font-size:16px;border:2px solid var(--g400);" id="myBannerAvatar">?</div>
        <div><div style="font-size:14px;font-weight:600;" id="myBannerName">我的排名</div><div style="font-size:11px;color:rgba(255,255,255,0.45);" id="myBannerDept">營運部</div></div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
        <div style="text-align:center;"><div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--orange);" id="myBannerRank">#7</div><div style="font-size:10px;color:rgba(255,255,255,0.4);">目前排名</div></div>
        <div style="text-align:center;"><div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--g300);" id="myBannerPts">1,240</div><div style="font-size:10px;color:rgba(255,255,255,0.4);">累積點數</div></div>
        <div style="text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--teal);" id="myBannerChange">↑ +5</div><div style="font-size:10px;color:rgba(255,255,255,0.4);">本週變化</div></div>
        <div style="text-align:center;"><div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:rgba(255,255,255,0.6);" id="myBannerPct">前 3%</div><div style="font-size:10px;color:rgba(255,255,255,0.4);">超越</div></div>
      </div>
    </div>

    <!-- Main Grid -->
    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;" id="lbMainGrid">

      <!-- Left: Podium + Table -->
      <div>
        <!-- Podium Top 3 -->
        <div class="card fade-in" style="margin-bottom:16px;">
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;">🏆 本期前三名</div>
          <div class="podium-container" id="podiumContainer"></div>
        </div>

        <!-- Full Table -->
        <div class="card fade-in">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;">完整排行榜</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.4);" id="lbCount">共 248 人</div>
          </div>
          <div id="lbTable"></div>
        </div>
      </div>

      <!-- Right: Charts + Stats -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- Top Stats -->
        <div class="card fade-in">
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;">排名分佈</div>
          <canvas id="rankChart" height="200"></canvas>
        </div>

        <!-- Growth Chart -->
        <div class="card fade-in">
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;">我的點數趨勢</div>
          <canvas id="growthChart" height="160"></canvas>
        </div>

        <!-- ESG Rank -->
        <div class="card fade-in">
          <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;">ESG 貢獻排行</div>
          <div id="esgRankList"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const DATA = {
  personal: [
    { name:'陳建志', dept:'研發部', pts:2340, change:'+12', pct:100, carbon:28.4 },
    { name:'王美玲', dept:'行銷部', pts:2105, change:'+8', pct:90, carbon:24.1 },
    { name:'張偉宏', dept:'人資部', pts:1890, change:'-1', pct:80.8, carbon:21.5 },
    { name:'吳淑芬', dept:'業務部', pts:1780, change:'+3', pct:76.1, carbon:20.2 },
    { name:'李志明', dept:'財務部', pts:1650, change:'+5', pct:70.5, carbon:18.8 },
    { name:'黃雅婷', dept:'研發部', pts:1540, change:'-2', pct:65.8, carbon:17.5 },
    { name:'林佳蓉', dept:'營運部', pts:1240, change:'+5', pct:53, carbon:12.5, isMe:true },
    { name:'劉雅惠', dept:'業務部', pts:1120, change:'+1', pct:47.9, carbon:11.2 },
    { name:'周志明', dept:'財務部', pts:980, change:'-3', pct:41.9, carbon:9.8 },
    { name:'鄭文慧', dept:'行銷部', pts:850, change:'+7', pct:36.3, carbon:8.5 },
    { name:'許明德', dept:'研發部', pts:720, change:'0', pct:30.8, carbon:7.2 },
    { name:'蔡曉玲', dept:'人資部', pts:680, change:'+2', pct:29.1, carbon:6.8 },
  ],
  dept: [
    { name:'研發部', dept:'28人', pts:15430, change:'+340', pct:100, carbon:185 },
    { name:'行銷部', dept:'22人', pts:12890, change:'+120', pct:83.5, carbon:148 },
    { name:'人資部', dept:'15人', pts:11200, change:'+210', pct:72.6, carbon:132 },
    { name:'營運部', dept:'18人', pts:9850, change:'+80', pct:63.8, carbon:115, isMe:true },
    { name:'業務部', dept:'32人', pts:8720, change:'-50', pct:56.5, carbon:98 },
    { name:'財務部', dept:'12人', pts:7640, change:'+160', pct:49.5, carbon:86 },
  ],
  company: [
    { name:'台積電', dept:'科技業', pts:125400, change:'+1200', pct:100, carbon:1520 },
    { name:'鴻海精密', dept:'製造業', pts:98700, change:'+850', pct:78.7, carbon:1180 },
    { name:'聯發科', dept:'半導體', pts:87300, change:'+630', pct:69.6, carbon:1020 },
    { name:'統一企業', dept:'食品業', pts:76500, change:'+420', pct:61, carbon:890 },
    { name:'imPR公關', dept:'公關業', pts:45200, change:'+380', pct:36, carbon:540, isMe:true },
  ],
  event: [
    { name:'ESG 挑戰賽 2025', dept:'248 人參與', pts:8920, change:'進行中', pct:100, carbon:980 },
    { name:'健走活動 5月場', dept:'156 人參與', pts:5640, change:'已結束', pct:63.2, carbon:680 },
    { name:'論壇簽到挑戰', dept:'89 人參與', pts:3200, change:'已結束', pct:35.9, carbon:210 },
  ]
};

let currentTab = 'personal';
let currentPeriod = 'week';

document.addEventListener('DOMContentLoaded', () => {
  loadUser();
  renderAll('personal');
  initCharts();
  renderESGRank();
});

function loadUser() {
  try {
    const u = JSON.parse(localStorage.getItem('gs_user')||'{}');
    const n = u.name||'林佳蓉';
    document.getElementById('sidebarAvatar').textContent = n.slice(0,2);
    document.getElementById('topbarAvatar').textContent = n.slice(0,2);
    document.getElementById('sidebarName').textContent = n;
    document.getElementById('myBannerAvatar').textContent = n.slice(0,2);
    document.getElementById('myBannerName').textContent = n;
  } catch(e){}
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAll(tab);
}

function switchPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function renderAll(tab) {
  const data = DATA[tab] || DATA.personal;
  renderPodium(data);
  renderTable(data);
  updateMyBanner(data, tab);
}

// ============================================================
// PODIUM
// ============================================================
function renderPodium(data) {
  const top3 = data.slice(0,3);
  const order = [top3[1], top3[0], top3[2]]; // 2nd, 1st, 3rd
  const heights = [100, 130, 85];
  const sizes = [44, 56, 40];
  const rankClasses = ['podium-2','podium-1','podium-3'];
  const medals = ['🥈','🥇','🥉'];
  const colors = ['rgba(200,200,200,0.8)','var(--yellow)','rgba(200,120,40,0.9)'];
  const container = document.getElementById('podiumContainer');
  container.innerHTML = '';
  order.forEach((d, i) => {
    if (!d) return;
    const realRank = i === 1 ? 1 : i === 0 ? 2 : 3;
    container.innerHTML += `
    <div class="podium-item">
      <div style="font-size:11px;color:rgba(255,255,255,0.6);max-width:80px;text-align:center;line-height:1.3;font-weight:500;">${d.name}</div>
      <div style="font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--g300);">${d.pts.toLocaleString()}</div>
      <div class="podium-avatar" style="width:${sizes[i]}px;height:${sizes[i]}px;font-size:${sizes[i]*0.35}px;background:linear-gradient(135deg,var(--g500),var(--teal));border:2px solid ${colors[i]};">
        ${d.name.slice(0,2)}
        <div class="podium-crown">${medals[i]}</div>
      </div>
      <div class="podium-base ${rankClasses[i]}" style="height:${heights[i]}px;">
        <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:${colors[i]};">${realRank}</div>
      </div>
    </div>`;
  });
}

// ============================================================
// TABLE
// ============================================================
function renderTable(data) {
  const container = document.getElementById('lbTable');
  const maxPts = data[0]?.pts || 1;
  container.innerHTML = '';
  document.getElementById('lbCount').textContent = `共 ${data.length} ${currentTab==='personal'?'人':currentTab==='dept'?'部門':currentTab==='company'?'企業':'活動'}`;
  data.forEach((d, i) => {
    const rankClass = i===0?'rank-g':i===1?'rank-s':i===2?'rank-b':'rank-n';
    const medal = ['🥇','🥈','🥉'][i] || '';
    const changeColor = d.change?.includes('+') ? 'color:var(--g400)' : d.change?.includes('-') ? 'color:var(--orange)' : 'color:rgba(255,255,255,0.3)';
    container.innerHTML += `
    <div class="lb-row ${d.isMe?'me':''}">
      <div class="lb-rank ${rankClass}">${medal||i+1}</div>
      <div class="avatar" style="width:34px;height:34px;font-size:12px;flex-shrink:0;${d.isMe?'border:1.5px solid var(--g400);':''}">${d.name.slice(0,2)}</div>
      <div style="flex:1;min-width:0;">
        <div class="lb-name" style="${d.isMe?'color:var(--g300);font-weight:700;':''}">
          ${d.name}
          ${d.isMe?'<span style="font-size:10px;background:rgba(34,197,94,0.2);color:var(--g300);padding:1px 6px;border-radius:10px;margin-left:6px;">我</span>':''}
        </div>
        <div class="lb-dept">${d.dept||''}</div>
      </div>
      <div class="lb-bar-wrap"><div class="lb-bar-track"><div class="lb-bar-fill" style="width:${(d.pts/maxPts*100).toFixed(1)}%;"></div></div></div>
      <div class="lb-change" style="${changeColor}">${d.change||'—'}</div>
      <div class="lb-pts">${d.pts.toLocaleString()}</div>
    </div>`;
  });
}

// ============================================================
// MY BANNER
// ============================================================
function updateMyBanner(data, tab) {
  const me = data.find(d=>d.isMe);
  if (!me) { document.getElementById('myRankBanner').style.display='none'; return; }
  document.getElementById('myRankBanner').style.display='flex';
  const rank = data.findIndex(d=>d.isMe)+1;
  document.getElementById('myBannerRank').textContent = '#' + rank;
  document.getElementById('myBannerPts').textContent = me.pts.toLocaleString();
  document.getElementById('myBannerChange').textContent = me.change || '—';
  document.getElementById('myBannerPct').textContent = `前 ${Math.round(rank/data.length*100)}%`;
  document.getElementById('myBannerDept').textContent = me.dept || '';
}

// ============================================================
// CHARTS
// ============================================================
function initCharts() {
  // Rank Distribution
  new Chart(document.getElementById('rankChart').getContext('2d'), {
    type:'doughnut',
    data: { labels:['前10%','11-25%','26-50%','51-100%'], datasets:[{ data:[24,48,88,88], backgroundColor:['rgba(255,214,10,0.7)','rgba(15,244,198,0.6)','rgba(34,197,94,0.5)','rgba(34,197,94,0.2)'], borderColor:'transparent', borderWidth:0 }] },
    options: { cutout:'70%', plugins:{ legend:{ position:'bottom', labels:{ color:'rgba(255,255,255,0.55)', font:{size:10}, padding:12 } }, tooltip:{ callbacks:{ label: c=>' '+c.label+': '+c.raw+'人' } } } }
  });

  // Growth
  new Chart(document.getElementById('growthChart').getContext('2d'), {
    type:'line',
    data: {
      labels:['4週前','3週前','2週前','上週','本週'],
      datasets:[{
        label:'點數', data:[640,820,980,1120,1240],
        borderColor:'var(--teal)', backgroundColor:'rgba(15,244,198,0.08)',
        fill:true, tension:0.4, pointBackgroundColor:'var(--teal)', pointRadius:4
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'rgba(13,61,35,0.95)', bodyColor:white, borderColor:'rgba(34,197,94,0.3)', borderWidth:1 } },
      scales:{ x:{ grid:{color:'rgba(34,197,94,0.05)'}, ticks:{color:'rgba(255,255,255,0.4)',font:{size:10}} }, y:{ grid:{color:'rgba(34,197,94,0.05)'}, ticks:{color:'rgba(255,255,255,0.4)',font:{size:10}}, border:{display:false} } }
    }
  });
}

function renderESGRank() {
  const esgData = DATA.personal.sort((a,b)=>b.carbon-a.carbon).slice(0,5);
  const maxC = esgData[0].carbon;
  const container = document.getElementById('esgRankList');
  container.innerHTML = '';
  esgData.forEach((d,i) => {
    container.innerHTML += `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:800;width:20px;color:${['var(--yellow)','rgba(200,200,200,0.8)','rgba(200,120,40,0.9)','rgba(255,255,255,0.4)','rgba(255,255,255,0.4)'][i]};">${i+1}</div>
      <div class="avatar" style="width:28px;height:28px;font-size:10px;">${d.name.slice(0,2)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;font-weight:500;${d.isMe?'color:var(--g300);':''}">${d.name}</div>
        <div style="height:3px;background:rgba(15,244,198,0.1);border-radius:2px;margin-top:3px;overflow:hidden;"><div style="height:100%;width:${(d.carbon/maxC*100)}%;background:linear-gradient(90deg,var(--teal),var(--g300));border-radius:2px;"></div></div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--teal);flex-shrink:0;">${d.carbon}kg</div>
    </div>`;
  });
}

  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
