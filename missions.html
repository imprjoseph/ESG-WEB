<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務系統 | GreenStep</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --g900:#0a2e1a;--g800:#0d3d23;--g700:#0f4d2c;--g600:#146b38;--g500:#1a8a46;--g400:#22c55e;--g300:#4ade80;--teal:#0ff4c6;--yellow:#ffd60a;--orange:#ff6b35;--bg:#071a0e;--sidebar-w:240px; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:white;min-height:100vh;display:flex;}
.font-display{font-family:'Syne',sans-serif;}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:linear-gradient(180deg,#0d3d23 0%,#071a0e 100%);border-right:1px solid rgba(34,197,94,0.12);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:40;transition:transform 0.3s;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(34,197,94,0.1);}
.nav-section{padding:16px 12px 4px;}
.nav-section-title{font-size:10px;font-weight:600;color:rgba(74,222,128,0.4);letter-spacing:1px;text-transform:uppercase;padding:0 8px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,0.55);transition:all 0.2s;margin-bottom:2px;text-decoration:none;}
.nav-item:hover{background:rgba(34,197,94,0.1);color:rgba(255,255,255,0.9);}
.nav-item.active{background:rgba(34,197,94,0.18);color:#4ade80;}
.nav-badge{margin-left:auto;background:var(--g500);color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.sidebar-user{margin-top:auto;padding:16px;border-top:1px solid rgba(34,197,94,0.1);}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--g500),var(--teal));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:rgba(7,26,14,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(34,197,94,0.1);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
.content{padding:24px 28px;flex:1;}
.card{background:linear-gradient(135deg,rgba(13,61,35,0.7) 0%,rgba(10,46,26,0.5) 100%);border:1px solid rgba(34,197,94,0.15);border-radius:16px;padding:20px;backdrop-filter:blur(8px);}
.btn-primary{background:linear-gradient(135deg,var(--g500),var(--g400));color:white;font-weight:600;padding:10px 20px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(34,197,94,0.3);}
.btn-teal{background:linear-gradient(135deg,rgba(15,244,198,0.2),rgba(15,244,198,0.1));color:var(--teal);border:1px solid rgba(15,244,198,0.3);font-weight:600;padding:10px 20px;border-radius:12px;cursor:pointer;font-size:14px;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;}
.btn-teal:hover{background:rgba(15,244,198,0.25);}
.filter-btn{padding:7px 16px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid rgba(34,197,94,0.2);font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;background:transparent;color:rgba(255,255,255,0.5);}
.filter-btn.on{background:rgba(34,197,94,0.2);color:var(--g300);border-color:rgba(34,197,94,0.4);}
.mission-card{background:rgba(255,255,255,0.04);border:1px solid rgba(34,197,94,0.12);border-radius:14px;padding:18px;transition:all 0.25s;cursor:pointer;}
.mission-card:hover{border-color:rgba(34,197,94,0.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2);}
.mission-card.done-card{opacity:0.5;pointer-events:none;}
.progress-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.8s;}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:0.3px;display:inline-block;}
.tag-daily{background:rgba(15,244,198,0.15);color:var(--teal);}
.tag-esg{background:rgba(34,197,94,0.15);color:var(--g300);}
.tag-event{background:rgba(255,214,10,0.15);color:var(--yellow);}
.tag-challenge{background:rgba(255,107,53,0.15);color:var(--orange);}
.tag-team{background:rgba(139,92,246,0.15);color:#a78bfa;}
.tag-health{background:rgba(239,68,68,0.15);color:#f87171;}
.tag-done{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:linear-gradient(135deg,#0d3d23,#071a0e);border:1px solid rgba(34,197,94,0.25);border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:0 32px 64px rgba(0,0,0,0.5);}
.modal-hidden{display:none;}

/* QR Scanner */
#qr-reader{border-radius:12px;overflow:hidden;}
#qr-reader video{border-radius:12px;}

/* Stats bar */
.stat-chip{background:rgba(255,255,255,0.05);border:1px solid rgba(34,197,94,0.12);border-radius:10px;padding:10px 16px;text-align:center;}
.icon-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(34,197,94,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;}
.icon-btn:hover{background:rgba(34,197,94,0.15);}
.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:35;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{margin-left:0;}
  .topbar{padding:0 16px;}
  .content{padding:16px;}
  .mobile-menu-btn{display:flex;}
}
.fade-in{animation:fadeIn 0.4s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--g700);border-radius:2px;}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="17" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/><path d="M18 6 C10 6 6 12 8 18 C10 24 16 28 18 30 C20 28 26 24 28 18 C30 12 26 6 18 6Z" fill="#22c55e" opacity="0.3"/><path d="M18 6 C22 10 26 15 24 20 C22 25 20 28 18 30" fill="#0ff4c6" opacity="0.6"/><circle cx="18" cy="18" r="3" fill="#0ff4c6"/></svg>
      <div><div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:white;">GreenStep</div><div style="font-size:10px;color:rgba(74,222,128,0.6);">ESG Gamification</div></div>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">主選單</div>
    <a href="dashboard.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="events.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8 2v3m8-3v3M3 8h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>活動<span class="nav-badge">3</span></a>
    <a href="missions.html" class="nav-item active"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>任務<span class="nav-badge">5</span></a>
    <a href="leaderboard.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>排行榜</a>
  </div>
  <div class="nav-section">
    <div class="nav-section-title">ESG</div>
    <a href="esg.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064"/></svg>ESG 統計</a>
    <a href="rewards.html" class="nav-item"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 8v13m0-13V6a4 4 0 014-4H6a4 4 0 014 4v2m-4 0h8M5 8h14l1 12H4L5 8z"/></svg>獎勵商城</a>
  </div>
  <div class="sidebar-user">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avatar" id="sidebarAvatar">?</div>
      <div><div style="font-size:13px;font-weight:600;" id="sidebarName">載入中</div><div style="font-size:11px;color:rgba(74,222,128,0.6);">一般使用者</div></div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="icon-btn mobile-menu-btn" onclick="toggleSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div><div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;">任務中心</div><div style="font-size:11px;color:rgba(74,222,128,0.5);">完成任務，累積點數與ESG貢獻</div></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-teal" onclick="openQRModal()" style="padding:8px 16px;font-size:13px;display:flex;align-items:center;gap:6px;">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h1m3 0h2m-2 3h2m-5 3h5"/></svg>
        QR 掃描
      </button>
      <div class="avatar" id="topbarAvatar" style="width:32px;height:32px;font-size:12px;cursor:pointer;">?</div>
    </div>
  </header>

  <div class="content">

    <!-- Stats row -->
    <div class="grid gap-4 stagger fade-in" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px;" id="statsRow">
      <div class="stat-chip">
        <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--g300);" id="statTotal">0</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">總任務數</div>
      </div>
      <div class="stat-chip">
        <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--teal);" id="statDone">0</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">已完成</div>
      </div>
      <div class="stat-chip">
        <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--yellow);" id="statPts">0</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">獲得點數</div>
      </div>
      <div class="stat-chip">
        <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--orange);" id="statCarbon">0</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">kg CO₂ 減碳</div>
      </div>
    </div>

    <!-- Filters -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="filter-btn on" onclick="filterMissions('all',this)">全部</button>
      <button class="filter-btn" onclick="filterMissions('daily',this)">每日任務</button>
      <button class="filter-btn" onclick="filterMissions('esg',this)">ESG任務</button>
      <button class="filter-btn" onclick="filterMissions('event',this)">活動任務</button>
      <button class="filter-btn" onclick="filterMissions('challenge',this)">挑戰任務</button>
      <button class="filter-btn" onclick="filterMissions('team',this)">團隊任務</button>
      <button class="filter-btn" onclick="filterMissions('health',this)">健康任務</button>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="filter-btn" onclick="filterMissions('todo',this)" id="filterTodo">待完成</button>
        <button class="filter-btn" onclick="filterMissions('done',this)" id="filterDone">已完成</button>
      </div>
    </div>

    <!-- Mission Grid -->
    <div id="missionGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;"></div>

  </div>
</div>

<!-- Mission Detail Modal -->
<div class="modal-overlay modal-hidden" id="missionModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
      <div>
        <div style="font-size:11px;margin-bottom:6px;" id="modalTag"></div>
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;" id="modalTitle"></div>
      </div>
      <button onclick="closeModal('missionModal')" style="background:rgba(255,255,255,0.08);border:none;color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:14px;margin-bottom:16px;">
      <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;" id="modalDesc"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;">
      <div style="text-align:center;background:rgba(34,197,94,0.08);border-radius:10px;padding:10px;">
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--g300);" id="modalPts">0</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4);">點數</div>
      </div>
      <div style="text-align:center;background:rgba(15,244,198,0.08);border-radius:10px;padding:10px;">
        <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--teal);" id="modalCarbon">0</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4);">kg CO₂</div>
      </div>
      <div style="text-align:center;background:rgba(255,214,10,0.08);border-radius:10px;padding:10px;">
        <div style="font-size:14px;font-weight:700;color:var(--yellow);" id="modalDeadline">—</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4);">截止日</div>
      </div>
    </div>
    <div id="modalVerifySection" style="margin-bottom:16px;"></div>
    <button class="btn-primary w-full" id="modalCompleteBtn" style="width:100%;text-align:center;font-size:15px;padding:14px;" onclick="modalComplete()">完成任務</button>
  </div>
</div>

<!-- QR Scanner Modal -->
<div class="modal-overlay modal-hidden" id="qrModal">
  <div class="modal" style="max-width:380px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;">QR Code 掃描</div>
      <button onclick="closeQRModal()" style="background:rgba(255,255,255,0.08);border:none;color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div id="qr-reader" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:240px;"></div>
    <div id="qrResult" style="margin-top:12px;text-align:center;font-size:13px;color:rgba(255,255,255,0.6);padding:10px;background:rgba(255,255,255,0.04);border-radius:10px;">請將 QR Code 對準鏡頭</div>
    <button onclick="simulateQRScan()" class="btn-teal" style="width:100%;margin-top:12px;padding:12px;font-size:14px;">模擬掃描（開發測試）</button>
  </div>
</div>

<!-- Photo Verify Modal -->
<div class="modal-overlay modal-hidden" id="photoModal">
  <div class="modal" style="max-width:400px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;">📷 拍照驗證</div>
      <button onclick="closeModal('photoModal')" style="background:rgba(255,255,255,0.08);border:none;color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">×</button>
    </div>
    <div style="background:rgba(255,255,255,0.03);border:2px dashed rgba(34,197,94,0.3);border-radius:14px;padding:32px;text-align:center;cursor:pointer;margin-bottom:16px;" onclick="document.getElementById('photoInput').click()">
      <div style="font-size:36px;margin-bottom:10px;">📷</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.6);">點擊上傳照片</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;">支援 JPG / PNG</div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(event)">
    </div>
    <div id="photoPreview" style="display:none;margin-bottom:16px;"><img id="photoImg" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover;" src="" alt="preview"></div>
    <button class="btn-primary" id="photoSubmitBtn" style="width:100%;padding:12px;font-size:14px;" onclick="submitPhoto()" disabled>提交審核</button>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50 transition-all duration-300" style="transform:translateY(80px);opacity:0;">
  <div style="background:rgba(13,61,35,0.95);backdrop-filter:blur(12px);border:1px solid rgba(34,197,94,0.3);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 16px 32px rgba(0,0,0,0.4);">
    <span id="toastIcon">✓</span><span id="toastMsg"></span>
  </div>
</div>

<script>
// ============================================================
// MISSION DATA
// ============================================================
const ALL_MISSIONS = [
  // Daily
  { id:1, type:'daily', title:'搭乘大眾運輸', desc:'搭乘捷運、公車或火車通勤，完成後點擊確認。', pts:30, carbon:0.5, done:false, verify:'manual', deadline:'今日', icon:'🚇' },
  { id:2, type:'daily', title:'自備環保杯', desc:'使用自備環保杯購買飲料，拍照上傳驗證。', pts:20, carbon:0.1, done:true, verify:'photo', deadline:'今日', icon:'☕' },
  { id:3, type:'daily', title:'步行達1,000步', desc:'今日步行累積達1,000步（連接健康App）', pts:25, carbon:0.2, done:false, verify:'auto', deadline:'今日', icon:'🚶', progress:680, target:1000 },
  { id:4, type:'daily', title:'拒絕一次性塑膠袋', desc:'購物時拒絕使用一次性塑膠袋。', pts:15, carbon:0.05, done:false, verify:'manual', deadline:'今日', icon:'🛍️' },
  { id:5, type:'daily', title:'今日無咖啡杯蓋', desc:'喝飲料不使用塑膠杯蓋。', pts:10, carbon:0.02, done:false, verify:'manual', deadline:'今日', icon:'🫙' },
  // ESG
  { id:6, type:'esg', title:'節能行為回報', desc:'關閉不必要電器或調高空調溫度至26度，拍照回報。', pts:40, carbon:0.8, done:false, verify:'photo', deadline:'本週', icon:'💡' },
  { id:7, type:'esg', title:'減少紙張使用', desc:'今日使用電子文件代替紙本，手動確認。', pts:20, carbon:0.15, done:false, verify:'manual', deadline:'本週', icon:'📄' },
  { id:8, type:'esg', title:'ESG 知識測驗', desc:'完成5題ESG知識小測驗，全對獲得雙倍點數。', pts:60, carbon:0, done:false, verify:'auto', deadline:'本月', icon:'📚' },
  { id:9, type:'esg', title:'垃圾分類完成', desc:'正確完成垃圾分類，拍照上傳。', pts:25, carbon:0.3, done:true, verify:'photo', deadline:'本週', icon:'♻️' },
  // Event
  { id:10, type:'event', title:'活動現場簽到', desc:'掃描活動現場QR Code完成報到。', pts:50, carbon:0, done:false, verify:'qr', deadline:'2025/06/15', icon:'📍' },
  { id:11, type:'event', title:'論壇議程完整出席', desc:'全程出席主論壇議程（系統自動記錄）', pts:100, carbon:0, done:false, verify:'auto', deadline:'2025/06/15', icon:'🎤' },
  { id:12, type:'event', title:'分享活動貼文', desc:'在社群媒體分享活動貼文，並截圖上傳。', pts:40, carbon:0, done:false, verify:'photo', deadline:'2025/06/30', icon:'📢' },
  // Challenge
  { id:13, type:'challenge', title:'7天連續ESG行動', desc:'連續完成7天的每日ESG任務，解鎖特殊徽章。', pts:200, carbon:0, done:false, verify:'auto', deadline:'2025/06/30', icon:'🔥', progress:5, target:7 },
  { id:14, type:'challenge', title:'累積減碳10kg', desc:'個人累積減碳達10kg CO₂。', pts:300, carbon:0, done:false, verify:'auto', deadline:'本月', icon:'🌍', progress:6.8, target:10 },
  // Team
  { id:15, type:'team', title:'部門集體健走', desc:'部門5人同時完成健走任務。', pts:80, carbon:0, done:false, verify:'qr', deadline:'本週', icon:'👥', teamProg:3, teamTarget:5 },
  // Health
  { id:16, type:'health', title:'健走10,000步', desc:'單日步行達10,000步（手機感應器記錄）', pts:60, carbon:0.5, done:false, verify:'auto', deadline:'今日', icon:'🏃', progress:4200, target:10000 },
  { id:17, type:'health', title:'做10分鐘伸展', desc:'完成辦公室10分鐘伸展，拍照上傳。', pts:30, carbon:0, done:false, verify:'photo', deadline:'今日', icon:'🧘' },
];

let currentFilter = 'all';
let currentMission = null;
let qrScanner = null;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadUser();
  renderStats();
  renderMissions('all');
});

function loadUser() {
  try { const u = JSON.parse(localStorage.getItem('gs_user')||'{}'); const n=u.name||'使用者'; document.getElementById('sidebarAvatar').textContent=n.slice(0,2); document.getElementById('topbarAvatar').textContent=n.slice(0,2); document.getElementById('sidebarName').textContent=n; } catch(e){}
}

function renderStats() {
  const total = ALL_MISSIONS.length;
  const done = ALL_MISSIONS.filter(m=>m.done).length;
  const pts = ALL_MISSIONS.filter(m=>m.done).reduce((a,m)=>a+m.pts,0);
  const carbon = ALL_MISSIONS.filter(m=>m.done).reduce((a,m)=>a+m.carbon,0);
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statPts').textContent = pts.toLocaleString();
  document.getElementById('statCarbon').textContent = carbon.toFixed(1);
}

// ============================================================
// RENDER MISSIONS
// ============================================================
function renderMissions(filter) {
  currentFilter = filter;
  let data = ALL_MISSIONS;
  if (filter === 'todo') data = ALL_MISSIONS.filter(m => !m.done);
  else if (filter === 'done') data = ALL_MISSIONS.filter(m => m.done);
  else if (filter !== 'all') data = ALL_MISSIONS.filter(m => m.type === filter);

  const grid = document.getElementById('missionGrid');
  grid.innerHTML = '';
  if (data.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:rgba(255,255,255,0.3);font-size:14px;">此分類目前沒有任務</div>';
    return;
  }
  data.forEach(m => {
    const tagClass = m.done ? 'tag-done' : `tag-${m.type}`;
    const typeLabel = {daily:'每日任務',esg:'ESG任務',event:'活動任務',challenge:'挑戰任務',team:'團隊任務',health:'健康任務'}[m.type]||m.type;
    const verifyLabel = {qr:'QR Code',gps:'GPS',photo:'拍照',manual:'手動',auto:'自動'}[m.verify]||m.verify;
    const pct = m.progress !== undefined ? Math.min(m.progress/m.target*100,100) : 0;
    grid.innerHTML += `
    <div class="mission-card fade-in ${m.done?'done-card':''}" onclick="openMissionModal(${m.id})">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${m.icon}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
            <span class="tag ${tagClass}">${typeLabel}</span>
            <span style="font-size:10px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);padding:2px 6px;border-radius:6px;">${verifyLabel}</span>
            ${m.done?'<span style="font-size:10px;color:var(--g400);">✓ 完成</span>':''}
          </div>
          <div style="font-size:14px;font-weight:600;color:${m.done?'rgba(255,255,255,0.35)':'white'};line-height:1.3;">${m.title}</div>
        </div>
      </div>
      <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${m.desc}</div>
      ${m.progress !== undefined ? `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px;"><span>進度</span><span>${m.progress}/${m.target}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${m.done?'var(--g400)':'linear-gradient(90deg,var(--teal),var(--g300))'}"></div></div>
      </div>` : ''}
      ${m.teamProg !== undefined ? `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px;"><span>團隊進度</span><span>${m.teamProg}/${m.teamTarget} 人</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${m.teamProg/m.teamTarget*100}%;background:linear-gradient(90deg,#a78bfa,#818cf8)"></div></div>
      </div>` : ''}
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:${m.done?'rgba(255,255,255,0.2)':'var(--g300)'};">${m.pts}<span style="font-size:10px;font-weight:400;margin-left:2px;">pts</span></div>
          ${m.carbon>0?`<div style="font-size:10px;color:var(--teal);background:rgba(15,244,198,0.1);padding:2px 7px;border-radius:6px;">-${m.carbon}kg CO₂</div>`:''}
        </div>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);">截止：${m.deadline}</div>
      </div>
    </div>`;
  });
}

function filterMissions(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderMissions(filter);
}

// ============================================================
// MISSION MODAL
// ============================================================
function openMissionModal(id) {
  currentMission = ALL_MISSIONS.find(m => m.id === id);
  if (!currentMission) return;
  const m = currentMission;
  const typeLabel = {daily:'每日任務',esg:'ESG任務',event:'活動任務',challenge:'挑戰任務',team:'團隊任務',health:'健康任務'}[m.type]||m.type;
  const tagClass = m.done ? 'tag-done' : `tag-${m.type}`;
  document.getElementById('modalTag').innerHTML = `<span class="tag ${tagClass}">${m.icon} ${typeLabel}</span>`;
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalDesc').textContent = m.desc;
  document.getElementById('modalPts').textContent = m.pts;
  document.getElementById('modalCarbon').textContent = m.carbon > 0 ? m.carbon : '—';
  document.getElementById('modalDeadline').textContent = m.deadline;

  const verifySection = document.getElementById('modalVerifySection');
  const verifyLabel = {qr:'📱 需要 QR Code 掃描驗證',gps:'📍 需要 GPS 定位驗證',photo:'📷 需要拍照上傳驗證',manual:'✅ 手動確認完成',auto:'⚡ 系統自動判斷'}[m.verify]||'';
  verifySection.innerHTML = `<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;font-size:13px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:8px;">${verifyLabel}</div>`;

  const btn = document.getElementById('modalCompleteBtn');
  if (m.done) {
    btn.textContent = '✓ 已完成'; btn.disabled = true; btn.style.opacity='0.4';
  } else {
    btn.textContent = m.verify === 'qr' ? '📱 開啟 QR 掃描' : m.verify === 'photo' ? '📷 上傳照片' : '✅ 確認完成';
    btn.disabled = false; btn.style.opacity='1';
  }
  document.getElementById('missionModal').classList.remove('modal-hidden');
}

function modalComplete() {
  if (!currentMission) return;
  const m = currentMission;
  closeModal('missionModal');
  if (m.verify === 'qr') { openQRModal(); return; }
  if (m.verify === 'photo') { document.getElementById('photoModal').classList.remove('modal-hidden'); return; }
  // Manual/Auto
  completeMission(m.id);
}

function completeMission(id) {
  const m = ALL_MISSIONS.find(x => x.id === id);
  if (!m || m.done) return;
  m.done = true;
  renderMissions(currentFilter);
  renderStats();
  showToast(`🎉 任務完成！獲得 ${m.pts} 點數${m.carbon>0?` + ${m.carbon}kg CO₂ 減碳`:''}`, '🎉');
  // Update localStorage
  try { const u=JSON.parse(localStorage.getItem('gs_user')||'{}'); u.points=(u.points||0)+m.pts; u.carbon=(u.carbon||0)+m.carbon; localStorage.setItem('gs_user',JSON.stringify(u)); } catch(e){}
}

function closeModal(id) { document.getElementById(id).classList.add('modal-hidden'); }

// ============================================================
// QR SCANNER
// ============================================================
function openQRModal() {
  document.getElementById('qrModal').classList.remove('modal-hidden');
  document.getElementById('qrResult').textContent = '請將 QR Code 對準鏡頭';
  // Try to start camera
  try {
    if (!qrScanner) {
      qrScanner = new Html5Qrcode('qr-reader');
    }
    qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decoded) => { handleQRResult(decoded); },
      (err) => {}
    ).catch(err => { document.getElementById('qrResult').textContent = '無法開啟相機，請使用模擬掃描'; });
  } catch(e) { document.getElementById('qrResult').textContent = '掃描器初始化失敗，請使用模擬掃描'; }
}

function closeQRModal() {
  document.getElementById('qrModal').classList.add('modal-hidden');
  if (qrScanner) { try { qrScanner.stop().catch(()=>{}); } catch(e){} }
}

function handleQRResult(decoded) {
  closeQRModal();
  document.getElementById('qrResult').textContent = '已掃描：' + decoded;
  // Match mission or event checkin
  const missionId = 10; // Demo: match event checkin
  completeMission(missionId);
  showToast('QR 掃描成功！完成簽到任務', '📱');
}

function simulateQRScan() {
  closeQRModal();
  const missionId = currentMission ? currentMission.id : 10;
  completeMission(missionId);
  showToast('QR 掃描成功！任務完成', '📱');
}

// ============================================================
// PHOTO VERIFY
// ============================================================
function handlePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('photoImg').src = e.target.result;
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoSubmitBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

function submitPhoto() {
  closeModal('photoModal');
  if (currentMission) completeMission(currentMission.id);
  showToast('照片已提交審核，審核通過後即可獲得點數', '📷');
}

// ============================================================
// SIDEBAR / UTILS
// ============================================================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function showToast(msg, icon='✓') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.style.transform='translateY(0)'; t.style.opacity='1';
  setTimeout(()=>{ t.style.transform='translateY(80px)'; t.style.opacity='0'; }, 3500);
}
</script>
